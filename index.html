<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポートフォリオ</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- ヘッダー -->
  <header class="bg-indigo-600 text-white py-8 text-center">
    <h1 class="text-3xl font-bold">こべにのポートフォリオ</h1>
    
  </header>

  <main class="max-w-3xl mx-auto px-4 py-12 space-y-16">

    <!-- 自己紹介 -->
    <section>
      <h2 class="text-2xl font-bold mb-4">自己紹介</h2>
      <p class="mt-2 text-bray-600">こんにちは。<br>K.O.B.E.N.I です。<br>POSSEでプログラミングを学んでいます。</p>
    </section>

    <!-- スキルリスト -->
    <section>
      <h2 class="text-2xl font-bold mb-4">スキル</h2>
      <ul class="flex flex-wrap gap-2">
        <li class="group">
          <span class="transition-all duration-200 inline-block hover:scale-105
                   bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-sm">
          HTML</span>
         <div class="transition-all duration-300 ease-in-out
            group-hover:scale-105 
            bg-white rounded-lg shadow-md p-4 mt-4">
          HTMLを使って、Webページの構造を作成できる。
         </div>
        </li>
        <li class="group">
          <span class="transition-all duration-200 inline-block hover:scale-105
                   bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-sm">
          Tailwind CSS
          </span>
          <div class="transition-all duration-300 ease-in-out
            group-hover:scale-105 group-hover:-translate-y-1
            bg-white rounded-lg shadow-md p-4 mt-4">
          Tailwind CSSを使って、レスポンシブデザインやスタイリングができる。
          </div>
        </li>
        <li class="group">
          <span class="transition-all duration-200 inline-block hover:scale-105
                   bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-sm">
          JavaScript
          </span>
          <div class="transition-all duration-300 ease-in-out
            group-hover:scale-105 group-hover:-translate-y-1
            bg-white rounded-lg shadow-md p-4 mt-4">
          JavaScriptを使って、インタラクティブなWebアプリケーションを作成できる。
          </div>
        </li>
      </ul>
      
    </section>

    <!-- 作品スライダー -->
    <section>
      <h2 class="text-2xl font-bold mb-4">作品</h2>
      <section class="splide " aria-label="作品スライダー">
        <div class="splide__track ">
          <ul class="splide__list m-12">
            <li class="splide__slide group">
              <img src="./images/LINE_ALBUM_ウェルカムパーティー6,7！_260624_2.jpg" alt="作品1"
                   class="w-full rounded-lg object-cover ">
               <div class="absolute inset-0 bg-black/50 object-cover rounded-lg
              opacity-0 group-hover:opacity-100 
              transition-opacity duration-300
              flex items-center justify-center">
                   <a href="#" class="absolute inset-0 flex items-center justify-center text-white font-bold hover:scale-110 transition-transform duration-400">詳細を見る</a>
                </div>
            </li>
            <li class="splide__slide group relative">
              <img src="./images/LINE_ALBUM_新ハチームFNFｽﾞ_260624_1.jpg" alt="作品2"
                   class="w-full rounded-lg object-cover ">
               <div class="absolute inset-0 bg-black/50 object-cover rounded-lg
              opacity-0 group-hover:opacity-100 
              transition-opacity duration-300
              flex items-center justify-center">
                   <a href="#" class="absolute inset-0 flex items-center justify-center text-white font-bold hover:scale-110 transition-transform duration-400">詳細を見る</a>
                </div>
            </li>
             <li class="splide__slide group relative">
              <img src="./images/S__67969033.jpg" alt="作品3"
                   class="w-full rounded-lg object-cover">
                    <div class="absolute inset-0 bg-black/50 object-cover rounded-lg
              opacity-0 group-hover:opacity-100 
              transition-opacity duration-300
              flex items-center justify-center">
                   <a href="#" class="absolute inset-0 flex items-center justify-center text-white font-bold hover:scale-110 transition-transform duration-400">詳細を見る</a>
                </div>
            </li>
             <li class="splide__slide group relative">
              <img src="./images/S__138313737_0.jpg" alt="作品4"
                   class="w-full rounded-lg object-cover">
               <div class="absolute inset-0 bg-black/50 object-cover rounded-lg
              opacity-0 group-hover:opacity-100 
              transition-opacity duration-300
              flex items-center justify-center">
                   <a href="#" class="absolute inset-0 flex items-center justify-center text-white font-bold hover:scale-110 transition-transform duration-400">詳細を見る</a>
                </div>
            </li>
          </ul>
        </div>
      </section>
    </section>

  </main>

  <!-- フッター -->
  <footer class="bg-gray-800 text-gray-400 text-center py-6 mt-16">
    <p>2026 こべに</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
  <script src="./js/main.js"></script>
</body>
<script>
  new Splide('.splide', {
  type: 'loop',      // 'loop': 無限ループ / 'fade': フェード切り替え
  perPage: 2,        // 一度に表示するスライド数
  gap: '1rem',       // スライド間の隙間
  autoplay: true,    // 自動再生
  interval: 3000,    // 自動再生の間隔（ミリ秒）
}).mount();
</script>
</html>
